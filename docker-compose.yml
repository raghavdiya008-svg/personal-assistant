version: '3.8'

services:
  # ── 1. Authoritative State Ledger: PostgreSQL 16 ──────────
  postgres:
    image: postgres:16-alpine
    container_name: jarvis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-jarvis_state}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal_mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis_state"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── 2. High-Speed Task Queue: Redis 7 ─────────────────────
  redis:
    image: redis:7-alpine
    container_name: jarvis_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - internal_mesh
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── 3. Object Storage: MinIO (S3 Compatible) ──────────────
  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: jarvis_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jarvis_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jarvis_storage_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - internal_mesh
      - ingress_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 4. Unified Model Gateway: LiteLLM ─────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: jarvis_litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-jarvis-gateway-token}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    networks:
      - internal_mesh
      - ingress_net
    depends_on:
      - redis

  # ── 5. Workflow Orchestration: n8n ────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: jarvis_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=jarvis_state
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-jarvis}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-jarvis_secure_pass}
      - DB_POSTGRESDB_SCHEMA=n8n
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - internal_mesh
      - ingress_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── 6. Isolated Sandbox Runner (Quarantine) ───────────────
  sandbox-runner:
    image: python:3.10-slim
    container_name: jarvis_sandbox
    restart: unless-stopped
    command: sleep infinity
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - sandbox_net

networks:
  ingress_net:
    driver: bridge
  internal_mesh:
    internal: false
  sandbox_net:
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  n8n_data:
